name: CI Demo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Mostrar contenido del repo
      - name: List files
        run: ls -la

      # Paso 3: Mensaje de prueba
      - name: Print test message
        run: echo "Este es un mensaje de prueba desde GitHub Actions"
