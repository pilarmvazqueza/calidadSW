name: CI


on:
  pull_request:
  push:
    branches: [main, develop]


jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
      
name: Descargar el código
      uses: actions/checkout@v4

      
name: Instalar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: maven

      
name: Compilar y correr tests
      run: mvn -B verify