name: CI Demo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Mostrar contenido del repo
      - name: List files
        run: ls -la

      # Paso 3: Verificar que existe el archivo txt
      - name: Check text file
        run: |
          if [ -f "archivo.txt" ]; then
            echo "El archivo existe"
            cat archivo.txt
          else
            echo "El archivo no existe"
            exit 1
          fi
